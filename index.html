<!doctype html>
<!--
  ЗАКОН СТЕНДА
  Плакат смотрит на формат окна: буквы держат пропорции, а повторы BRAUN
  продолжаются вправо и вниз. Кадр проходит по буквам, а не по промежуткам
  у правого и нижнего края. Зоны наведения делят промежутки
  пополам, чтобы при переходе между колонками общий ритм не сбрасывался.
  Пять осей смотрят на прошедшее время и отвечают непрерывным сдвигом:
  нечётные идут вверх, чётные вниз, а повтор фигуры подхватывает ушедшую.
  Переключатель выбирает один темп для всех осей или отдельный для каждой.
  При каждом открытии плакат прямой и неподвижный. Кнопка движения запускает
  и останавливает ход с текущего положения; перетаскивание доступно на паузе.
  Обычный вид останавливает ход и возвращает положение и ритм всех букв.
  Плакат закреплён в окне. При открытии ритм 4 4 3 4 4. Один жест
  прокрутки выбирает соседний ритм; после последнего круг начинается снова.
  Панель меняет порядок и характер переходов или даёт собрать свой круг.
  Наведение на B, R, A, U, N выбирает те же ритмы. Колесо возвращает
  управление прокрутке, а движение курсора по плакату — наведению.
  Одна общая кривая задаёт боковой сдвиг на каждой высоте всем пяти осям.
  Пластичность выбирает сдвиг целой буквы или изгиб её векторного контура.
  Тумблер вида выбирает обычный неподвижный плакат или сохранённый
  искажённый эталон с общей кривой и отдельными скоростями осей.
-->

  <style>
    :root {
      /* ПАРАМЕТРЫ: меняются здесь */
      --orange: #e54515;
      --braun-dark: #200903;
      --poster-bg: var(--orange);
      --poster-ink: var(--braun-dark);
      --poster-text-on-ink: #fff;
      --poster-scale: 1;
      --poster-position-x: 50%;
      --poster-position-y: 50%;
      --motion-speed: 48;
    }

    :root.braun-inverted {
      --poster-bg: var(--braun-dark);
      --poster-ink: var(--orange);
      --poster-text-on-ink: var(--braun-dark);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--poster-bg);
    }

    .poster-scroll {
      position: fixed;
      inset: 0;
      overflow: hidden;
      overscroll-behavior: contain;
    }

    .poster-scroll:focus-visible {
      outline: 2px solid var(--poster-ink);
      outline-offset: -2px;
    }

    .poster {
      display: block;
      width: 100%;
      height: 100%;
      transform: scale(var(--poster-scale));
      transform-origin: var(--poster-position-x) var(--poster-position-y);
      shape-rendering: geometricPrecision;
      text-rendering: geometricPrecision;
    }

    .letter {
      fill: var(--poster-ink);
    }

    .meta {
      fill: var(--poster-ink);
      font-family: Arial, Helvetica, sans-serif;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .meta--overlap {
      fill: var(--poster-text-on-ink);
      pointer-events: none;
    }

    .axis-hit {
      fill: transparent;
      pointer-events: all;
      cursor: grab;
      outline: none;
      touch-action: none;
    }

    .axis-hit.is-dragging {
      cursor: grabbing;
    }

    .poster-scroll.is-scroll-rhythm,
    .is-scroll-rhythm .axis-hit {
      touch-action: pinch-zoom;
    }

    .flow-region {
      position: fixed;
      pointer-events: none;
    }

    .st-panel .braun-rhythm-editor {
      display: grid;
      gap: 8px;
      width: 100%;
    }

    .st-panel .braun-rhythm-editor select {
      max-width: none;
      width: 100%;
    }

    .st-panel .braun-rhythm-axes {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 4px;
      text-align: center;
    }

    .st-panel .braun-rhythm-axes label { min-width: 0; }

    .st-panel .braun-rhythm-axes select {
      display: block;
      margin-top: 4px;
      padding: 5px 15px 5px 5px;
      background-position: right 3px center;
    }

    .st-panel .braun-rhythm-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

  </style>
</head>

  <script>
    const RHYTHM_PATTERNS = [
      [4, 4, 3, 4, 4], // исходный
      [4, 3, 4, 3, 4], // B
      [3, 4, 3, 4, 3], // R
      [4, 4, 4, 4, 4], // A
      [3, 3, 3, 3, 3], // U
      [3, 4, 4, 3, 3]  // N
    ];
    const RHYTHM_PRESETS = {
      original: RHYTHM_PATTERNS.slice(1),
      roll: ['44434', '44443', '34444', '43444'].map(step => Array.from(step, Number)),
      breath: ['43334', '33333', '33433', '34443', '44444'].map(step => Array.from(step, Number)),
      pendulum: ['33344', '33444', '34443', '44433', '44333'].map(step => Array.from(step, Number))
    };
    const RHYTHM_CHOICES = [
      ['original', 'Исходный'], ['roll', 'Перекат'], ['breath', 'Вдох'],
      ['pendulum', 'Маятник'], ['custom', 'Свой']
    ];
    const WHEEL_GESTURE_GAP_MS = 120;
    const SCROLL_RHYTHM_RESPONSE = 0.035;

    const straightTrajectory = () => ({
      uzly: [{ x: 0.5, y: 0, r: 0.5 }, { x: 0.5, y: 0.5, r: 0.5 }, { x: 0.5, y: 1, r: 0.5 }],
      zamknut: false
    });
    const distortedTrajectory = () => ({
      uzly: [
        { x: 0.8414, y: -0.0161, r: 0.5 },
        { x: 0.9149, y: 0.5985, r: 0.5,
          ho: { x: -0.2114, y: 0.0518 },
          hi: { x: 0.2114, y: -0.0518 }, z: 'ugoldlina' },
        { x: 0.5, y: 1, r: 0.5 }
      ],
      zamknut: false
    });
    const DEFAULTS = {
      distortedView: false,
      invertedTheme: true,
      motionEnabled: false,
      speed: 26,
      syncSpeeds: false,
      axisSpeed1: 26,
      axisSpeed2: 72,
      axisSpeed3: 126,
      axisSpeed4: 164,
      axisSpeed5: 200,
      scrollRhythm: true,
      rhythmPreset: 'original',
      customRhythms: RHYTHM_PRESETS.original,
      linkedRhythm: true,
      rhythmStrength: 100,
      rhythmInertia: 15,
      flowStrength: 100,
      flowPlasticity: 100,
      flowTrajectory: straightTrajectory()
    };
    const P = JSON.parse(JSON.stringify(DEFAULTS));
    try {
      Object.assign(P, JSON.parse(localStorage.getItem('braun-poster-motion') || '{}'));
    } catch (error) {}
    P.invertedTheme = P.invertedTheme === true;
    if (!RHYTHM_CHOICES.some(([key]) => key === P.rhythmPreset)) P.rhythmPreset = DEFAULTS.rhythmPreset;
    if (!Array.isArray(P.customRhythms) || !P.customRhythms.length || !P.customRhythms.every(step =>
      Array.isArray(step) && step.length === RHYTHM_PATTERNS[0].length && step.every(count => count === 3 || count === 4)
    )) P.customRhythms = DEFAULTS.customRhythms;
    if (!Array.isArray(P.flowTrajectory?.uzly) || P.flowTrajectory.uzly.length < 2) {
      P.flowTrajectory = straightTrajectory();
    }
    let flowRevision = 0;
    let flowProfile = [];
    let flowActive = false;
    let viewsReady = false;

    function syncAxisSpeeds() {
      for (let index = 1; index <= 5; index += 1) {
        P[`axisSpeed${index}`] = P.speed;
      }
    }

    function applyParameters(key) {
      document.documentElement.classList.toggle('braun-inverted', P.invertedTheme);
      if (viewsReady && key === 'distortedView') {
        if (P.distortedView) restoreDistortedView();
        else resetView();
        return;
      }
      if (viewsReady && !P.distortedView && key?.startsWith('flow')) {
        P.distortedView = true;
        motionPanel.obnovit();
        motionPanel.save();
      }
      if (P.syncSpeeds && (key === 'speed' || key === 'syncSpeeds')) {
        syncAxisSpeeds();
      }
      if (viewsReady && (key === 'scrollRhythm' || key === 'rhythmPreset' || !key || key.startsWith('__'))) {
        setScrollRhythmMode();
      }
      document.documentElement.style.setProperty('--motion-speed', P.speed);
      if (!key || key.startsWith('flow') || key.startsWith('__')) rebuildFlow();
    }

    applyParameters();

    StendPanel.tip('braun-rhythm-editor', (row, def, params, api) => {
      row.classList.add('dva');
      const editor = document.createElement('div');
      editor.className = 'braun-rhythm-editor';
      const steps = document.createElement('select');
      steps.id = 'braun-custom-rhythm-step';
      row.querySelector('label').htmlFor = steps.id;
      const grid = document.createElement('div');
      grid.className = 'braun-rhythm-axes';
      const actions = document.createElement('div');
      actions.className = 'braun-rhythm-actions';
      let selected = 0;

      const counts = Array.from('BRAUN', (letter, axis) => {
        const label = document.createElement('label');
        label.textContent = letter;
        const input = document.createElement('select');
        input.setAttribute('aria-label', `Буква ${letter}`);
        input.append(new Option('3', '3'), new Option('4', '4'));
        input.addEventListener('change', () => {
          const updated = params.customRhythms.map((step, i) => i === selected
            ? step.map((count, j) => j === axis ? Number(input.value) : count)
            : step);
          save(updated);
        });
        label.append(input);
        grid.append(label);
        return input;
      });

      function button(text, label, action) {
        const control = document.createElement('button');
        control.type = 'button';
        control.className = 'st-chip';
        control.textContent = text;
        control.setAttribute('aria-label', label);
        control.addEventListener('click', action);
        actions.append(control);
        return control;
      }

      button('+ Шаг', 'Добавить шаг', () => {
        const updated = params.customRhythms.slice();
        updated.splice(selected + 1, 0, updated[selected].slice());
        selected++;
        save(updated);
      });
      const remove = button('Удалить', 'Удалить шаг', () => {
        const updated = params.customRhythms.filter((_, i) => i !== selected);
        selected = Math.min(selected, updated.length - 1);
        save(updated);
      });
      const earlier = button('↑', 'Переместить шаг раньше', () => move(-1));

    // Эталон находится в DEFAULTS; сохранённые в браузере правки идут поверх него.

    const axisMasks = [...document.querySelectorAll('.axis-mask')];
    const axisHits = [...document.querySelectorAll('.axis-hit')];
    const poster = document.querySelector('.poster');
    const posterScroll = document.querySelector('.poster-scroll');
    let scrollRhythmIndex = 0;
    let scrollTakesPriority = false;
    let scrollTransition = null;
    let lastWheelTime = -Infinity;
    let lastWheelDirection = 0;
    let swipeStart;
    let cursorX, cursorY;

    function scrollRhythmSteps() {
      return P.rhythmPreset === 'custom' ? P.customRhythms : RHYTHM_PRESETS[P.rhythmPreset];
    }

    function currentScrollRhythm() {
      return scrollRhythmSteps()[scrollRhythmIndex - 1] || RHYTHM_PATTERNS[0];
    }

    function showScrollRhythm(index) {
      const previous = currentScrollRhythm();
      scrollRhythmIndex = index;
      scrollTakesPriority = true;
      const next = currentScrollRhythm();
      const incoming = next.findIndex((count, i) => count === 3 && previous[i] === 4);
      let duration, delay;
      if (P.rhythmPreset === 'roll') {
        duration = 330;
        delay = i => i === incoming ? 0 : 48;
      } else if (P.rhythmPreset === 'breath') {
        duration = 470;
        delay = i => Math.abs(i - 2) * 56;
      } else if (P.rhythmPreset === 'pendulum') {
        duration = 400;
        delay = i => Math.abs(i - (incoming < 0 ? 2 : incoming)) * 28;
      }
      // Новый жест сразу задаёт цель, переход начинается с текущей формы букв.
      scrollTransition = duration ? {
        started: performance.now(), duration,
        delays: axes.map((_, i) => delay(i)),
        from: axes.map(axis => axis.rhythmScale)
      } : null;
    }

    function stepScrollRhythm(direction) {
      const count = scrollRhythmSteps().length + 1;
      showScrollRhythm((scrollRhythmIndex + direction + count) % count);
    }

    function elasticRhythmProgress(time) {
      if (time <= 0) return 0;
      if (time >= 1) return 1;
      const t = time * 6;
      return 1 - Math.exp(-t) * (Math.cos(t) + Math.sin(t));
    }

    function onPosterWheel(event) {
      if (!P.scrollRhythm || event.ctrlKey) return;
      const mode = event.deltaMode;
      if (Math.abs(event.deltaY) <= Math.abs(event.deltaX)) return;
      event.preventDefault();
      if (event.momentum) {
        lastWheelTime = -Infinity;
        return;
      }

      // Колесо даёт отдельные щелчки, тачпад — поток мелких событий.
      const legacyDelta = Math.abs(event.wheelDeltaY);
      const deviceScale = window.devicePixelRatio || 1;
      const rawDelta = legacyDelta * deviceScale;
      const ticks = Math.round(rawDelta / 120);
      const wheelClick = mode !== 0 || (legacyDelta > 0 && (
        legacyDelta % 120 === 0 || (ticks > 0 && Math.abs(rawDelta - ticks * 120) < deviceScale)
      ));
      const direction = Math.sign(event.deltaY);
      const newGesture = direction !== lastWheelDirection || event.timeStamp - lastWheelTime >= WHEEL_GESTURE_GAP_MS;
      lastWheelTime = event.timeStamp;
      lastWheelDirection = direction;
      if (wheelClick || newGesture) {
        cursorX = event.clientX;
        cursorY = event.clientY;
        stepScrollRhythm(direction);
      }
    }

    function onPosterKey(event) {
      if (!P.scrollRhythm || event.altKey || event.ctrlKey || event.metaKey) return;
      if (event.key === 'ArrowDown' || event.key === 'PageDown') {
        event.preventDefault();
        stepScrollRhythm(1);
      } else if (event.key === 'ArrowUp' || event.key === 'PageUp') {
        event.preventDefault();
        stepScrollRhythm(-1);
      }
    }

    function startPosterSwipe(event) {
      if (!P.scrollRhythm || event.pointerType !== 'touch') return;

    function movePosterSwipe(event) {
      if (swipeStart?.id !== event.pointerId) return;
      const dy = swipeStart.y - event.clientY;
      const dx = swipeStart.x - event.clientX;

      swipeStart = undefined;
      stepScrollRhythm(Math.sign(dy));
    }

    function endPosterSwipe(event) {
      if (swipeStart?.id === event.pointerId) swipeStart = undefined;
    }

    function setScrollRhythmMode() {
      posterScroll.classList.toggle('is-scroll-rhythm', P.scrollRhythm);

      posterScroll.setAttribute('aria-label', P.scrollRhythm ? 'Плакат Braun. Прокрутка и наведение меняют ритм букв.' : 'Плакат Braun. Наведение меняет ритм букв.');

      lastWheelDirection = 0;

    posterScroll.addEventListener('wheel', onPosterWheel, { passive: false });
    posterScroll.addEventListener('keydown', onPosterKey);
    posterScroll.addEventListener('pointerdown', startPosterSwipe);
    posterScroll.addEventListener('pointermove', movePosterSwipe);
    posterScroll.addEventListener('pointerup', endPosterSwipe);
    posterScroll.addEventListener('pointercancel', endPosterSwipe);
    const [, , tileWidth, tileHeight] = poster.getAttribute('viewBox').split(' ').map(Number);
    let fieldHeight = tileHeight;
    let fieldOffsets = [0];
    const axes = [...document.querySelectorAll('.axis')].map((element, index) => ({
      element,
      mask: axisMasks[index],
      direction: Number(element.dataset.direction),
      period: Number(element.dataset.period),
      hoverPeriod: Number(element.dataset.hoverPeriod),
      phase: 0,
      rhythmScale: 1,
      hovered: false,
      pointerOver: false,
      focused: false,
      dragging: false,
      pointerId: null,

    // На одной высоте все оси получают один сдвиг. Таблица строится только
    // при правке кривой; в кадре нужны лишь две соседние точки таблицы.
    function rebuildFlow() {
      const samples = Array.from({ length: 513 }, (_, i) =>
        StendPanel.put.tochka(P.flowTrajectory, i / 512, 1, 1));
      flowProfile = Array.from({ length: 513 }, (_, i) => {
        const y = i / 512;
        let closest = samples[0];
        for (let j = 1; j < samples.length; j++) {
          const a = samples[j - 1], b = samples[j];
          if (b.y !== a.y && (y - a.y) * (y - b.y) <= 0) {
            return a.x + (b.x - a.x) * (y - a.y) / (b.y - a.y) - 0.5;
          }
          if (Math.abs(b.y - y) < Math.abs(closest.y - y)) closest = b;
        }
        return closest.x - 0.5;
      });
      flowActive = P.flowStrength > 0 && flowProfile.some(x => Math.abs(x) > 0.00001);
      flowRevision++;
    }

    function flowShift(y) {
      const t = Math.max(0, Math.min(512, y / fieldHeight * 512));
      const i = Math.min(511, Math.floor(t));
      return (flowProfile[i] + (flowProfile[i + 1] - flowProfile[i]) * (t - i))
        * tileWidth * P.flowStrength / 100;
    }

    const svgNS = 'http://www.w3.org/2000/svg';
    function svgNode(tag, attrs = {}) {
      const node = document.createElementNS(svgNS, tag);
      Object.entries(attrs).forEach(([key, value]) => node.setAttribute(key, value));
      return node;
    }

    // Сгущаем контур до шага не больше четырёх единиц исходного плаката.
    // Это SVG-пути, не картинка и не растровый фильтр; отверстия сохраняются.
    function contourPoints(d) {
      const tokens = d.match(/[MHVCZ]|-?\d*\.?\d+(?:e[-+]?\d+)?/gi);
      const contours = [];
      let cursor = 0, point = { x: 0, y: 0 }, start, contour;
      const number = () => Number(tokens[cursor++]);
      function line(end) {
        const count = Math.max(1, Math.ceil(Math.hypot(end.x - point.x, end.y - point.y) / 4));
        for (let i = 1; i <= count; i++) contour.push({
          x: point.x + (end.x - point.x) * i / count,
          y: point.y + (end.y - point.y) * i / count
        });
        point = end;
      }
      while (cursor < tokens.length) {
        const command = tokens[cursor++].toUpperCase();
        if (command === 'M') {
          point = { x: number(), y: number() };
          start = point;
          contour = [point];
          contours.push(contour);
        } else if (command === 'H') line({ x: number(), y: point.y });
        else if (command === 'V') line({ x: point.x, y: number() });
        else if (command === 'C') {
          const a = point, b = { x: number(), y: number() };
          const c = { x: number(), y: number() }, end = { x: number(), y: number() };
          const count = Math.max(8, Math.ceil(3 * Math.max(Math.hypot(b.x-a.x,b.y-a.y),
            Math.hypot(c.x-b.x,c.y-b.y), Math.hypot(end.x-c.x,end.y-c.y)) / 4));
          for (let i = 1; i <= count; i++) {
            const t = i / count, u = 1 - t;
            contour.push({ x: u*u*u*a.x + 3*u*u*t*b.x + 3*u*t*t*c.x + t*t*t*end.x,
              y: u*u*u*a.y + 3*u*u*t*b.y + 3*u*t*t*c.y + t*t*t*end.y });
          }
          point = end;
        } else if (command === 'Z') line(start);
        else throw new Error('Неизвестная команда контура: ' + command);
      }
      return contours;
    }

    function flowTile(axis, index, use, maskUse, tileIndex) {
      return {
        use, maskUse,
        x: Number(use.getAttribute('x')), y: Number(use.getAttribute('y')),
        height: Number(use.getAttribute('height')),
        shapes: axis.glyphShapes.map((shape, shapeIndex) => {
          const id = `flow-${index}-${tileIndex}-${shapeIndex}`;
          const path = svgNode('path', { id, class: 'letter', 'fill-rule': shape.fillRule });
          const maskPath = svgNode('use', { href: '#' + id });
          axis.warp.append(path);
          axis.maskWarp.append(maskPath);
          return { path, maskPath, contours: shape.contours };
        })
      };
    }

    axes.forEach((axis, index) => {
      axis.originals = [...axis.element.querySelectorAll('use')];
      axis.maskOriginals = [...axis.mask.querySelectorAll('use')];
      axis.warp = svgNode('g');
      axis.maskWarp = svgNode('g');
      axis.warp.style.display = axis.maskWarp.style.display = 'none';
      axis.element.append(axis.warp);
      axis.mask.append(axis.maskWarp);
      const use = axis.originals[0];
      const symbol = document.querySelector(use.getAttribute('href'));
      const box = symbol.viewBox.baseVal;
      const scaleX = Number(use.getAttribute('width')) / box.width;
      const scaleY = Number(use.getAttribute('height')) / box.height;
      axis.glyphShapes = [...symbol.children].map(shape => {
        const matrix = shape.transform.baseVal.consolidate()?.matrix;
        return {
          fillRule: shape.getAttribute('fill-rule') || 'nonzero',
          contours: contourPoints(shape.getAttribute('d')).map(contour => contour.map(point => {
            const x = matrix ? matrix.a * point.x + matrix.c * point.y + matrix.e : point.x;
            const y = matrix ? matrix.b * point.x + matrix.d * point.y + matrix.f : point.y;
            return { x: (x - box.x) * scaleX, y: (y - box.y) * scaleY };
          }))
        };
      });
      axis.tiles = axis.originals.map((use, tileIndex) => flowTile(axis, index, use, axis.maskOriginals[tileIndex], tileIndex));
      axis.baseTiles = axis.tiles.length;
      const oldHit = axisHits[index];
      axis.x = Number(oldHit.getAttribute('x'));
      axis.width = Number(oldHit.getAttribute('width'));
      const hit = svgNode('path');
      [...oldHit.attributes].forEach(attr => {
        if (!['x','y','width','height'].includes(attr.name)) hit.setAttribute(attr.name, attr.value);
      });
      oldHit.replaceWith(hit);
      axisHits[index] = hit;

    const letterGap = axes[1].x - (axes[0].x + axes[0].width);
    const tilePitch = tileWidth + letterGap;
    // Соседние зоны делят одну и ту же границу, включая шов N → B.
    const hitEdges = [-letterGap / 2, ...axes.slice(1).map((axis, i) =>
      (axes[i].x + axes[i].width + axis.x) / 2), tileWidth + letterGap / 2];
    const letterRepeats = document.querySelector('#letter-repeats');
    const maskRepeats = document.querySelector('#mask-letter-repeats');
    const captionsMask = document.querySelector('#moving-letters-mask');
    const captionRepeats = document.querySelector('#caption-repeats');
    const captionPitch = Math.ceil(tileHeight / axes[0].period) * axes[0].period;
    const rowPeriods = [...new Set(axes.flatMap(axis => [axis.period, axis.hoverPeriod]))];
    const rowSpans = rowPeriods.map(period => ({
      period,
      height: Math.min(...axes.map(axis => axis.tiles[0].height * period / axis.period))
    }));
    let fittedSize = '';

    function framedWidth(width, height) {
      const aspect = width / height;
      let edgeX = Math.max(tileWidth, tileHeight * aspect);
      // Если край попал в промежуток, слегка приближаем всё поле до контура.
      // После поправки одного края проверяем другой: масштаб у них общий.
      while (true) {
        const inset = Math.min(edgeX / width, letterGap / 4);
        const repeatX = Math.floor((edgeX - inset) / tilePitch) * tilePitch;
        const column = axes.findLast(axis => repeatX + axis.x <= edgeX - inset);
        const right = repeatX + column.x + column.width - inset;
        const edgeY = edgeX / aspect;
        const bottom = Math.min(...rowSpans.map(({ period, height }) => {
          const rowY = Math.floor((edgeY - inset) / period) * period;
          return rowY + height - inset;
        }));
        const next = Math.min(edgeX, right, bottom * aspect);
        if (edgeX - next < 0.0001) return next;
        edgeX = next;
      }
    }

    function fitPoster() {
      const { width, height } = posterScroll.getBoundingClientRect();
      if (!width || !height || fittedSize === `${width}:${height}`) return;
      fittedSize = `${width}:${height}`;
      const fieldWidth = framedWidth(width, height);
      fieldHeight = fieldWidth * height / width;
      poster.setAttribute('viewBox', `0 0 ${fieldWidth} ${fieldHeight}`);

      // По одному запасному повтору за каждым краем для изогнутого вида.
      fieldOffsets = Array.from({ length: Math.ceil(fieldWidth / tilePitch) + 2 }, (_, i) => (i - 1) * tilePitch);
      const repeatedOffsets = fieldOffsets.filter(x => x !== 0);
      letterRepeats.replaceChildren(...repeatedOffsets.map(x => svgNode('use', { href: '#letter-field', x })));
      // Светлые подписи должны видеть буквы всего поля, включая запасные края.
      captionsMask.setAttribute('width', fieldWidth);
      captionsMask.setAttribute('height', fieldHeight);
      maskRepeats.replaceChildren(...repeatedOffsets.map(x => svgNode('use', { href: '#mask-letter-field', x })));

      const copies = [];
      for (let y = 0; y < fieldHeight; y += captionPitch) {
        for (const x of fieldOffsets) {
          if (x >= 0 && x < fieldWidth && (x || y)) copies.push(svgNode('use', { href: '#caption-tile', x, y }));
        }
      }
      captionRepeats.replaceChildren(...copies);

      axes.forEach((axis, index) => {
        const needed = Math.max(axis.baseTiles, Math.ceil(fieldHeight / Math.min(axis.period, axis.hoverPeriod)) + 2);
        while (axis.tiles.length < needed) {
          const tileIndex = axis.tiles.length;
          const use = axis.originals[0].cloneNode();
          const maskUse = axis.maskOriginals[0].cloneNode();
          const y = (tileIndex - 1) * axis.period;
          use.setAttribute('y', y);
          maskUse.setAttribute('y', y);
          axis.warp.before(use);
          axis.maskWarp.before(maskUse);
          axis.originals.push(use);
          axis.maskOriginals.push(maskUse);
          axis.tiles.push(flowTile(axis, index, use, maskUse, tileIndex));
        }
        while (axis.tiles.length > needed) {
          const { use, maskUse, shapes } = axis.tiles.pop();
          use.remove(); maskUse.remove();
          shapes.forEach(({ path, maskPath }) => { path.remove(); maskPath.remove(); });
          axis.originals.pop();
          axis.maskOriginals.pop();
        }
        axis.flowActive = undefined;
      });

      const matrix = poster.getScreenCTM();
      if (matrix) Object.assign(document.querySelector('.flow-region').style, {
        left: matrix.e + 'px', top: matrix.f + 'px',
        width: tileWidth * matrix.a + 'px', height: fieldHeight * matrix.d + 'px'
      });
      flowRevision++;
    }

    function renderFlow(axis, index, offset) {
      if (axis.hitRevision !== flowRevision) {
        const segments = flowActive ? 160 : 1;
        const samples = Array.from({ length: segments + 1 }, (_, i) => {
          const y = fieldHeight * i / segments;
          return { y, shift: flowActive ? flowShift(y) : 0 };
        });
        const bands = fieldOffsets.map(x => {
          const edge = (base, points) => points.map(({y, shift}) => `${(base + x + shift).toFixed(2)} ${y.toFixed(2)}`).join('L');
          return 'M' + edge(hitEdges[index], samples) + 'L' + edge(hitEdges[index + 1], samples.slice().reverse()) + 'Z';
        });
        axisHits[index].setAttribute('d', bands.join(''));
        axis.hitRevision = flowRevision;
      }
      const renderKey = `${flowRevision}:${offset.toFixed(3)}:${axis.rhythmScale.toFixed(5)}`;
      if (renderKey === axis.renderKey) return;
      axis.renderKey = renderKey;
      if (axis.flowActive !== flowActive) {
        axis.originals.concat(axis.maskOriginals).forEach(node => node.style.display = flowActive ? 'none' : '');
        axis.warp.style.display = axis.maskWarp.style.display = flowActive ? '' : 'none';
        axis.flowActive = flowActive;
      }
      if (!flowActive) return;
      const plasticity = P.flowPlasticity / 100;
      axis.tiles.forEach(tile => {
        const centerY = (tile.y + tile.height / 2) * axis.rhythmScale + offset;
        const centerShift = flowShift(centerY);
        tile.shapes.forEach(shape => {
          const outside = (tile.y + tile.height) * axis.rhythmScale + offset < 0
            || tile.y * axis.rhythmScale + offset > fieldHeight;
          shape.path.style.display = outside ? 'none' : '';
          if (outside) return;
          const d = shape.contours.map(contour => contour.map((point, i) => {
            const y = point.y + tile.y;
            const shift = centerShift * (1 - plasticity)
              + flowShift(y * axis.rhythmScale + offset) * plasticity;
            return `${i ? 'L' : 'M'}${(point.x + tile.x + shift).toFixed(2)} ${y.toFixed(2)}`;
          }).join('') + 'Z').join('');
          shape.path.setAttribute('d', d);
        });
      });
    }

    function hoverAxis(index) {
      if (index >= 0) scrollTakesPriority = false;
      axes.forEach((axis, i) => {
        axis.pointerOver = i === index;
        axis.hovered = axis.pointerOver || axis.focused || axis.dragging;
      });
    }
    // Сбрасываем наведение только при уходе со всего поля, не между путями.
    axisHits[0].parentElement.addEventListener('pointerleave', (event) => {
      if (event.pointerType !== 'touch') {
        cursorX = cursorY = undefined;
        hoverAxis(-1);
      }
    });

    axisHits.forEach((hit, index) => {
      const axis = axes[index];
      const updateHover = () => {
        axis.hovered = axis.pointerOver || axis.focused || axis.dragging;
      };

      hit.addEventListener('focus', () => {
        // Клик мышью не должен оставлять общую реакцию включённой
        // после ухода курсора. Фокус клавиатуры, наоборот, удерживает её.
        axis.focused = hit.matches(':focus-visible');
        if (axis.focused) scrollTakesPriority = false;
        updateHover();
      });

      hit.addEventListener('blur', () => {
        axis.focused = false;
        updateHover();
      });

      hit.addEventListener('pointerdown', (event) => {
        if (event.pointerType === 'mouse' && event.button !== 0) return;
        if (P.scrollRhythm && event.pointerType === 'touch') return;
        if (event.pointerType !== 'touch') hoverAxis(index);
        axis.dragging = true;
        axis.pointerId = event.pointerId;
        axis.lastPointerY = event.clientY;
        hit.classList.add('is-dragging');
        hit.setPointerCapture(event.pointerId);
        updateHover();
        event.preventDefault();
      });

      hit.addEventListener('pointermove', (event) => {
        if (event.pointerType !== 'touch') {
          // Прокрутку прерывает только движение курсора, даже в той же колонке.
          const moved = event.clientX !== cursorX || event.clientY !== cursorY;
          cursorX = event.clientX;
          cursorY = event.clientY;
          if (moved && (scrollTakesPriority || !axis.pointerOver)) hoverAxis(index);
        }
        if (!axis.dragging) return;

        const delta = (event.clientY - axis.lastPointerY) / (poster.getScreenCTM()?.d || 1);
        const livePeriod = axis.period * axis.rhythmScale;
        axis.phase += delta / livePeriod; // без ручки: фигура следует за рукой 1:1
        axis.phase = ((axis.phase % 1) + 1) % 1;
        axis.lastPointerY = event.clientY;
        event.preventDefault();
      });

      const release = (event) => {
        if (!axis.dragging) return;
        axis.dragging = false;
        axis.pointerId = null;
        hit.classList.remove('is-dragging');
        if (hit.hasPointerCapture(event.pointerId)) hit.releasePointerCapture(event.pointerId);
        updateHover();
      };

      hit.addEventListener('pointerup', release);
      hit.addEventListener('pointercancel', release);
    });

    let previousTime = performance.now();

    function resetView() {
      P.distortedView = false;
      P.motionEnabled = false;
      P.flowTrajectory = straightTrajectory();
      P.flowStrength = DEFAULTS.flowStrength;
      P.flowPlasticity = DEFAULTS.flowPlasticity;
      setScrollRhythmMode();
      rebuildFlow();
      resetAxisPositions();
      motionPanel.obnovit();
      motionPanel.save();
    }

    function restoreDistortedView() {
      Object.assign(P, JSON.parse(JSON.stringify(DEFAULTS)), {
        distortedView: true,
        invertedTheme: P.invertedTheme,
        motionEnabled: P.motionEnabled,
        scrollRhythm: P.scrollRhythm,
        rhythmPreset: P.rhythmPreset,
        customRhythms: P.customRhythms,
        flowTrajectory: distortedTrajectory()
      });
      rebuildFlow();
      resetAxisPositions();
      motionPanel.obnovit();
      motionPanel.save();
    }

    function resetAxisPositions() {
      axes.forEach((axis, index) => {
        const hit = axisHits[index];
        if (axis.pointerId !== null && hit.hasPointerCapture(axis.pointerId)) {
          hit.releasePointerCapture(axis.pointerId);
        }
        if (document.activeElement === hit) hit.blur();
        axis.phase = 0;
        axis.rhythmScale = 1;
        axis.hovered = false;
        axis.pointerOver = false;
        axis.focused = false;
        axis.dragging = false;
        axis.pointerId = null;
        axis.lastPointerY = 0;
        hit.classList.remove('is-dragging');
        axis.element.setAttribute('transform', 'translate(0 0) scale(1 1)');
        axis.mask.setAttribute('transform', 'translate(0 0) scale(1 1)');
      });
      previousTime = performance.now();
    }

    viewsReady = true;
    // Тема, сценарий и свои шаги сохраняются между открытиями.
    Object.assign(P, JSON.parse(JSON.stringify(DEFAULTS)), {
      invertedTheme: P.invertedTheme,
      rhythmPreset: P.rhythmPreset,
      customRhythms: P.customRhythms
    });
    applyParameters('invertedTheme');
    resetView();
    fitPoster();
    new ResizeObserver(fitPoster).observe(poster);

    function animate(currentTime) {
      const elapsed = Math.min((currentTime - previousTime) / 1000, 0.05);
      previousTime = currentTime;
      if (document.hidden) {
        requestAnimationFrame(animate);
        return;
      }
      const scrolling = scrollTakesPriority;
      const basePattern = RHYTHM_PATTERNS[0];
      let pattern = currentScrollRhythm();
      if (!scrolling && P.linkedRhythm) {
        // Курсор имеет приоритет перед фокусом клавиатуры.
        const pointerAxis = axes.findIndex(axis => axis.pointerOver || axis.dragging);
        const activeAxis = pointerAxis >= 0 ? pointerAxis : axes.findIndex(axis => axis.hovered);
        if (activeAxis >= 0) pattern = RHYTHM_PATTERNS[activeAxis + 1];
      }
      const strength = P.rhythmStrength / 100;
      const responseTime = scrolling ? SCROLL_RHYTHM_RESPONSE : 0.02 + (P.rhythmInertia / 100) * 0.86;
      const follow = reducedMotion.matches ? 1 : 1 - Math.exp(-elapsed / responseTime);
      const transition = scrolling && !reducedMotion.matches ? scrollTransition : null;

      axes.forEach((axis, index) => {
        let changesCount = pattern[index] !== basePattern[index];
        if (!scrolling && !P.linkedRhythm && axis.hovered) changesCount = !changesCount;
        const targetScale = changesCount ? 1 + (axis.hoverPeriod / axis.period - 1) * strength : 1;

        if (transition) {
          const time = (currentTime - transition.started - transition.delays[index]) / transition.duration;
          const startScale = transition.from[index];
          axis.rhythmScale = startScale + (targetScale - startScale) * elasticRhythmProgress(time);
        } else {
          axis.rhythmScale += (targetScale - axis.rhythmScale) * follow;
        }
        if (Math.abs(targetScale - axis.rhythmScale) < 0.0001) axis.rhythmScale = targetScale;

        const livePeriod = axis.period * axis.rhythmScale;
        if (P.motionEnabled && !axis.dragging) {
          const speed = P.syncSpeeds ? P.speed : P[`axisSpeed${index + 1}`];
          axis.phase += axis.direction * speed * elapsed / livePeriod;
        }
        axis.phase = ((axis.phase % 1) + 1) % 1;

        const wrappedOffset = axis.phase * livePeriod;
        const transform = `translate(0 ${wrappedOffset}) scale(1 ${axis.rhythmScale})`;
        axis.element.setAttribute('transform', transform);
        axis.mask.setAttribute('transform', transform);
        renderFlow(axis, index, wrappedOffset);
      });

      requestAnimationFrame(animate);
    }

    requestAnimationFrame(animate);
  </script>
</body>
</html>
